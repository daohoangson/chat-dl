name: Live integration

on:
  workflow_dispatch:

jobs:
  public-shares:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check live public shares
        env:
          PUPPETEER_HEADLESS: "true"
          PUPPETEER_NO_SANDBOX: "true"
        run: npm run test:integration
