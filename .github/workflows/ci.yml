name: CI

on:
  push:
  pull_request:

jobs:
  biome:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Biome CI
        run: npm run ci

      - name: Build
        run: npm run build

      - name: Offline regression tests
        run: npm test
